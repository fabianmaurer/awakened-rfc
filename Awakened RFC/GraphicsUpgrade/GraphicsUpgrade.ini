[lighting]
; Keep the lighting and sun at the configured starting time.
LightCycleOn=0
; A neutral daylight avoids the default golden tint.
SunColour=255,250,245

; Avoid terrain-height shadows that can create large dark patches on hills.
[shadows]
HillShadows=0

; Reduce the reflected sky's contribution at typical map viewing angles.
[water]
WaterConstants=0,0.238738,0.0954951,0.7
